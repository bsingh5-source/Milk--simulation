<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Milk Mystery Game: Comparison View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
        .person { transition: all 0.3s ease; }
        .allele-L { color: #3b82f6; } 
        .allele-l { color: #ef4444; } 
        .sim-container { min-height: 500px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">
    <div class="max-w-7xl mx-auto p-4">
        <!-- Header -->
        <header class="bg-white rounded-2xl shadow-sm p-6 mb-6 mt-4 border-b-4 border-indigo-500 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">🥛 Milk Mystery: Lab Comparison</h1>
                <p class="text-slate-500 italic">Compare Natural Selection vs. Genetic Equilibrium</p>
            </div>
            <button onclick="resetAll()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold transition-colors">
                <i class="fas fa-undo mr-2"></i> Reset Both
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- SIMULATION A: NO PRESSURE -->
            <div class="sim-container bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden">
                <div class="bg-blue-500 p-4 text-white flex justify-between items-center">
                    <h2 class="font-bold flex items-center gap-2"><i class="fas fa-bread-slice"></i> Simulation A: No Pressure</h2>
                    <span id="gen-a" class="bg-white/20 px-3 py-1 rounded-full text-sm font-bold">Gen: 1</span>
                </div>
                
                <div class="p-6 space-y-6">
                    <!-- Grid -->
                    <div id="grid-a" class="grid grid-cols-8 gap-2 min-h-[220px]"></div>

                    <!-- Stats -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                            <p class="text-[10px] uppercase font-bold text-slate-400">L Allele (Blue)</p>
                            <p id="stat-a-L" class="text-2xl font-bold text-blue-600">50%</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                            <p class="text-[10px] uppercase font-bold text-slate-400">l Allele (Red)</p>
                            <p id="stat-a-l" class="text-2xl font-bold text-red-500">50%</p>
                        </div>
                    </div>

                    <!-- History -->
                    <div class="h-16 border-b border-slate-100 flex items-end gap-1 px-2" id="timeline-a"></div>

                    <button onclick="step('a')" id="btn-a" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all">
                        Next Generation (A)
                    </button>
                </div>
            </div>

            <!-- SIMULATION B: FAMINE -->
            <div class="sim-container bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden">
                <div class="bg-red-500 p-4 text-white flex justify-between items-center">
                    <h2 class="font-bold flex items-center gap-2"><i class="fas fa-skull-crossbones"></i> Simulation B: Famine</h2>
                    <span id="gen-b" class="bg-white/20 px-3 py-1 rounded-full text-sm font-bold">Gen: 1</span>
                </div>
                
                <div class="p-6 space-y-6">
                    <!-- Grid -->
                    <div id="grid-b" class="grid grid-cols-8 gap-2 min-h-[220px]"></div>

                    <!-- Stats -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                            <p class="text-[10px] uppercase font-bold text-slate-400">L Allele (Blue)</p>
                            <p id="stat-b-L" class="text-2xl font-bold text-blue-600">50%</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                            <p class="text-[10px] uppercase font-bold text-slate-400">l Allele (Red)</p>
                            <p id="stat-b-l" class="text-2xl font-bold text-red-500">50%</p>
                        </div>
                    </div>

                    <!-- History -->
                    <div class="h-16 border-b border-slate-100 flex items-end gap-1 px-2" id="timeline-b"></div>

                    <button onclick="step('b')" id="btn-b" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl transition-all">
                        Next Generation (B)
                    </button>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="mt-8 pt-6 border-t border-slate-200 text-center text-slate-400 text-xs">
            <p>Data for Table 3.3 and Bar Graph (Page 8) | <i class="fab fa-github"></i> milk-mystery-lab</p>
        </footer>
    </div>

    <script>
        const SIM_SIZE = 40;
        let state = {
            a: { gen: 1, pop: [], mode: 'none' },
            b: { gen: 1, pop: [], mode: 'famine' }
        };

        function initSim(key) {
            state[key].gen = 1;
            state[key].pop = [];
            for (let i = 0; i < SIM_SIZE; i++) {
                state[key].pop.push({ a1: 'L', a2: 'l' });
            }
            document.getElementById(`timeline-${key}`).innerHTML = '';
            document.getElementById(`btn-${key}`).disabled = false;
            document.getElementById(`btn-${key}`).innerText = `Next Generation (${key.toUpperCase()})`;
            render(key);
        }

        function step(key) {
            if (state[key].gen >= 5) return;

            let parents = [...state[key].pop];
            if (state[key].mode === 'famine') {
                parents = parents.filter(p => p.a1 === 'L' || p.a2 === 'L');
            }

            if (parents.length < 2) return;

            let nextPop = [];
            for (let i = 0; i < SIM_SIZE; i++) {
                const p1 = parents[Math.floor(Math.random() * parents.length)];
                const p2 = parents[Math.floor(Math.random() * parents.length)];
                nextPop.push({ 
                    a1: Math.random() > 0.5 ? p1.a1 : p1.a2, 
                    a2: Math.random() > 0.5 ? p2.a1 : p2.a2 
                });
            }

            state[key].pop = nextPop;
            state[key].gen++;
            render(key);
        }

        function render(key) {
            const container = document.getElementById(`grid-${key}`);
            container.innerHTML = '';
            
            let lCount = 0;
            state[key].pop.forEach(p => {
                if (p.a1 === 'L') lCount++;
                if (p.a2 === 'L') lCount++;
                
                const isSick = p.a1 === 'l' && p.a2 === 'l';
                const div = document.createElement('div');
                div.className = 'person flex flex-col items-center justify-center';
                div.innerHTML = `<i class="fas fa-user text-lg ${isSick ? 'text-red-400' : 'text-blue-500'}"></i><span class="text-[8px] font-bold text-slate-400">${p.a1}${p.a2}</span>`;
                container.appendChild(div);
            });

            const lPercent = Math.round((lCount / (SIM_SIZE * 2)) * 100);
            document.getElementById(`stat-${key}-L`).innerText = lPercent + '%';
            document.getElementById(`stat-${key}-l`).innerText = (100 - lPercent) + '%';
            document.getElementById(`gen-${key}`).innerText = `Gen: ${state[key].gen}`;

            // Add bar to history
            const bar = document.createElement('div');
            bar.className = `flex-1 ${key === 'a' ? 'bg-blue-400' : 'bg-red-400'} rounded-t`;
            bar.style.height = `${lPercent}%`;
            document.getElementById(`timeline-${key}`).appendChild(bar);

            if (state[key].gen >= 5) {
                const btn = document.getElementById(`btn-${key}`);
                btn.disabled = true;
                btn.innerText = "Simulation Finished";
                btn.className = "w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-2xl cursor-not-allowed";
            }
        }

        function resetAll() {
            initSim('a');
            initSim('b');
        }

        window.onload = resetAll;
    </script>
</body>
</html>
